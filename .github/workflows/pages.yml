# Publishes the course website (site/) to GitHub Pages on every push to main.
# The manifest and exercise catalog are regenerated from the Markdown each time,
# so new modules and exercises appear on the site without any manual step.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build manifest and exercise catalog
        run: node site/tools/build-manifest.mjs

      - name: Assemble the site
        run: |
          mkdir -p _site
          # The site reads module Markdown from the repository, so publish the course content next to site/.
          # The resume is personal: keep it out of the public site (links to it point at GitHub instead).
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'node_modules' \
            --exclude 'Shakir_Resume_CPP.*' ./ _site/
          # The repository root opens the site.
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Systems Mastery Lab</title>' \
            '<meta http-equiv="refresh" content="0; url=site/">' \
            '<a href="site/">Open the Systems Mastery Lab</a>' > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
